<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 900 1050"
     width="100%"
     height="100%"
     style="background-color: #f8fafc; font-family: system-ui, -apple-system, sans-serif;">

  <defs>

    <!-- ================= FILTERS ================= -->

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6"
                    flood-color="#cbd5e1" flood-opacity="0.4"/>
    </filter>

    <filter id="light-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3"
                    flood-color="#cbd5e1" flood-opacity="0.2"/>
    </filter>


    <!-- ================= ARROW MARKERS ================= -->

    <marker id="arrow"
            viewBox="0 0 10 10"
            refX="9"
            refY="5"
            markerWidth="6"
            markerHeight="6"
            orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z"
            fill="#475569"/>
    </marker>

    <marker id="arrow-purple"
            viewBox="0 0 10 10"
            refX="9"
            refY="5"
            markerWidth="6"
            markerHeight="6"
            orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z"
            fill="#8b5cf6"/>
    </marker>

    <marker id="arrow-green"
            viewBox="0 0 10 10"
            refX="9"
            refY="5"
            markerWidth="6"
            markerHeight="6"
            orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z"
            fill="#10b981"/>
    </marker>

  </defs>


  <!-- ====================================================== -->
  <!-- HEADER -->
  <!-- ====================================================== -->

  <g text-anchor="middle">

    <text x="450"
          y="55"
          font-size="36"
          font-weight="900"
          fill="#0f172a"
          letter-spacing="1">
      EKA
    </text>

    <text x="450"
          y="80"
          font-size="16"
          font-weight="600"
          fill="#64748b">
      Enterprise Knowledge Assistant
    </text>

  </g>


  <!-- ====================================================== -->
  <!-- PRIMARY DOWNWARD FLOW -->
  <!-- ====================================================== -->

  <line x1="450" y1="150"
        x2="450" y2="180"
        stroke="#475569"
        stroke-width="2.5"
        marker-end="url(#arrow)"/>

  <line x1="450" y1="250"
        x2="450" y2="280"
        stroke="#475569"
        stroke-width="2.5"
        marker-end="url(#arrow)"/>

  <line x1="450" y1="340"
        x2="450" y2="400"
        stroke="#475569"
        stroke-width="2.5"
        marker-end="url(#arrow)"/>


  <!-- ====================================================== -->
  <!-- USER -->
  <!-- ====================================================== -->

  <g transform="translate(375,100)">

    <rect width="150"
          height="50"
          rx="25"
          fill="#ffffff"
          filter="url(#shadow)"
          stroke="#f97316"
          stroke-width="1.5"/>

    <circle cx="28"
            cy="25"
            r="14"
            fill="#fff7ed"/>

    <path d="M28 18
             c-1.9 0-3.5 1.6-3.5 3.5
             s1.6 3.5 3.5 3.5
             3.5-1.6 3.5-3.5
             -1.6-3.5-3.5-3.5z
             m-5 11
             c0-2.3 3.3-3.5 5-3.5
             s5 1.2 5 3.5
             v1
             h-10
             v-1z"
          fill="#f97316"/>

    <text x="54"
          y="30"
          font-size="15"
          font-weight="700"
          fill="#1e293b">
      USER
    </text>

  </g>


  <!-- ====================================================== -->
  <!-- CHAT INTERFACE -->
  <!-- ====================================================== -->

  <g transform="translate(325,190)">

    <rect width="250"
          height="60"
          rx="12"
          fill="#ffffff"
          filter="url(#shadow)"/>

    <rect width="8"
          height="60"
          rx="4"
          fill="#3b82f6"/>

    <text x="125"
          y="27"
          font-size="15"
          font-weight="800"
          fill="#1e293b"
          text-anchor="middle">
      CHAT INTERFACE
    </text>

    <text x="125"
          y="47"
          font-size="13"
          font-weight="500"
          fill="#64748b"
          text-anchor="middle">
      HTML / CSS / JS
    </text>

  </g>


  <!-- ====================================================== -->
  <!-- FLASK API -->
  <!-- ====================================================== -->

  <g transform="translate(325,290)">

    <rect width="250"
          height="50"
          rx="12"
          fill="#ffffff"
          filter="url(#shadow)"/>

    <rect width="8"
          height="50"
          rx="4"
          fill="#94a3b8"/>

    <text x="125"
          y="30"
          font-size="15"
          font-weight="800"
          fill="#1e293b"
          text-anchor="middle">
      FLASK API
    </text>

  </g>


  <!-- ====================================================== -->
  <!-- LANGGRAPH WORKFLOW -->
  <!-- ====================================================== -->

  <g transform="translate(290,370)">

    <rect width="320"
          height="250"
          rx="12"
          fill="#f8fafc"
          stroke="#94a3b8"
          stroke-width="2"
          stroke-dasharray="6,4"/>

    <text x="20"
          y="28"
          font-size="13"
          font-weight="800"
          fill="#475569"
          letter-spacing="1">
      LANGGRAPH WORKFLOW
    </text>

    <rect x="220"
          y="12"
          width="85"
          height="22"
          rx="6"
          fill="#e2e8f0"
          stroke="#cbd5e1"
          stroke-width="1"/>

    <text x="262.5"
          y="27"
          font-size="11"
          font-weight="600"
          fill="#475569"
          text-anchor="middle">
      MemorySaver
    </text>

  </g>


  <!-- ====================================================== -->
  <!-- MODEL -->
  <!-- ====================================================== -->

  <g transform="translate(330,410)">

    <rect width="240"
          height="60"
          rx="12"
          fill="#f5f3ff"
          filter="url(#shadow)"
          stroke="#c4b5fd"
          stroke-width="1.5"/>

    <rect width="8"
          height="60"
          rx="4"
          fill="#8b5cf6"/>

    <text x="120"
          y="27"
          font-size="15"
          font-weight="800"
          fill="#4c1d95"
          text-anchor="middle">
      MODEL
    </text>

    <text x="120"
          y="47"
          font-size="13"
          font-weight="600"
          fill="#6d28d9"
          text-anchor="middle">
      Gemini + Tool Calling
    </text>

  </g>


  <!-- ====================================================== -->
  <!-- RETRIEVAL TOOL -->
  <!-- ====================================================== -->

  <g transform="translate(345,530)">

    <rect width="210"
          height="60"
          rx="12"
          fill="#ffffff"
          filter="url(#shadow)"/>

    <rect width="8"
          height="60"
          rx="4"
          fill="#0ea5e9"/>

    <text x="105"
          y="27"
          font-size="14"
          font-weight="800"
          fill="#1e293b"
          text-anchor="middle">
      RETRIEVAL TOOL
    </text>

    <text x="105"
          y="47"
          font-size="13"
          font-weight="500"
          fill="#64748b"
          text-anchor="middle">
      retrieve_documents
    </text>

  </g>


  <!-- ====================================================== -->
  <!-- CHROMA DB -->
  <!-- ====================================================== -->

  <g transform="translate(325,660)">

    <rect width="250"
          height="60"
          rx="12"
          fill="#ffffff"
          filter="url(#shadow)"/>

    <rect width="8"
          height="60"
          rx="4"
          fill="#10b981"/>

    <text x="125"
          y="27"
          font-size="15"
          font-weight="800"
          fill="#1e293b"
          text-anchor="middle">
      CHROMA
    </text>

    <text x="125"
          y="47"
          font-size="13"
          font-weight="500"
          fill="#64748b"
          text-anchor="middle">
      Persistent Vector Store
    </text>

  </g>


  <!-- ====================================================== -->
  <!-- GREEN RETURN FLOW -->
  <!-- Broken into two pieces like the purple return flow -->
  <!-- ====================================================== -->

  <!-- Chroma -> right side -->
 <path d="M 575 690
         L 655 690
         Q 670 690 670 675
         L 670 575"
      fill="none"
      stroke="#10b981"
      stroke-width="2.5"/>


  <!-- right side -> Model -->
<path d="M 670 530
         L 670 455
         Q 670 440 655 440
         L 570 440"
      fill="none"
      stroke="#10b981"
      stroke-width="2.5"
      marker-end="url(#arrow-green)"/>


  <!-- Retrieved Context Label -->

  <rect x="620"
        y="540"
        width="115"
        height="24"
        fill="#ecfdf5"
        rx="4"/>

  <text x="677"
        y="557"
        font-size="12"
        font-weight="600"
        fill="#047857"
        text-anchor="middle">
    retrieved context
  </text>


<!-- ====================================================== -->
<!-- PURPLE RETURN FLOW -->
<!-- ====================================================== -->

<!-- Model -> Chat -->
<path d="M 330 440
         L 225 440
         Q 210 440 210 425
         L 210 325"
      fill="none"
      stroke="#8b5cf6"
      stroke-width="2.5"
      marker-end="url(#arrow-purple)"/>


<!-- Chat -> User -->
<path d="M 210 280
         L 210 140
         Q 210 125 225 125
         L 366 125"
      fill="none"
      stroke="#8b5cf6"
      stroke-width="2.5"
      marker-end="url(#arrow-purple)"/>


<!-- Answer Label -->
<rect x="145"
      y="290"
      width="130"
      height="24"
      fill="#f5f3ff"
      rx="4"/>

<text x="210"
      y="307"
      font-size="12"
      font-weight="700"
      fill="#6d28d9"
      text-anchor="middle">
  Answer + Citations
</text>

  <!-- ====================================================== -->
  <!-- SHOULD CONTINUE FLOW -->
  <!-- Put AFTER nodes so it stays visible -->
  <!-- ====================================================== -->

  <!-- Model -> Retrieval -->
  <line x1="450"
        y1="470"
        x2="450"
        y2="520"
        stroke="#475569"
        stroke-width="2.5"
        marker-end="url(#arrow)"/>



  <!-- Label -->
  <text x="460" y="495" font-size="13" font-weight="600" fill="#475569">should_continue</text>


  <!-- Retrieval -> Chroma -->
  <line x1="450"
        y1="590"
        x2="450"
        y2="650"
        stroke="#475569"
        stroke-width="2.5"
        marker-end="url(#arrow)"/>


  <!-- ====================================================== -->
  <!-- SEPARATOR -->
  <!-- ====================================================== -->

  <line x1="100"
        y1="780"
        x2="800"
        y2="780"
        stroke="#cbd5e1"
        stroke-width="2"
        stroke-dasharray="8,6"/>


  <!-- ====================================================== -->
  <!-- OFFLINE PIPELINE TITLE -->
  <!-- ====================================================== -->

  <g text-anchor="middle">

    <text x="450"
          y="825"
          font-size="15"
          font-weight="800"
          fill="#475569"
          letter-spacing="1">
      OFFLINE KNOWLEDGE BASE PIPELINE
    </text>

  </g>


  <!-- ====================================================== -->
  <!-- PIPELINE ARROWS -->
  <!-- ====================================================== -->

  <line x1="220"
        y1="890"
        x2="260"
        y2="890"
        stroke="#94a3b8"
        stroke-width="2.5"
        marker-end="url(#arrow)"/>

  <line x1="410"
        y1="890"
        x2="450"
        y2="890"
        stroke="#94a3b8"
        stroke-width="2.5"
        marker-end="url(#arrow)"/>

  <line x1="640"
        y1="890"
        x2="680"
        y2="890"
        stroke="#94a3b8"
        stroke-width="2.5"
        marker-end="url(#arrow)"/>


  <!-- ====================================================== -->
  <!-- DOCUMENTATION -->
  <!-- ====================================================== -->

  <g transform="translate(60,860)">

    <rect width="160"
          height="60"
          rx="12"
          fill="#ffffff"
          filter="url(#light-shadow)"/>

    <rect width="6"
          height="60"
          rx="3"
          fill="#f59e0b"/>

    <text x="83"
          y="27"
          font-size="14"
          font-weight="800"
          fill="#1e293b"
          text-anchor="middle">
      Documentation
    </text>

    <text x="83"
          y="47"
          font-size="13"
          font-weight="500"
          fill="#64748b"
          text-anchor="middle">
      JSON
    </text>

  </g>


  <!-- ====================================================== -->
  <!-- TEXT CHUNKING -->
  <!-- ====================================================== -->

  <g transform="translate(270,860)">

    <rect width="140"
          height="60"
          rx="12"
          fill="#ffffff"
          filter="url(#light-shadow)"/>

    <rect width="6"
          height="60"
          rx="3"
          fill="#f59e0b"/>

    <text x="73"
          y="35"
          font-size="14"
          font-weight="800"
          fill="#1e293b"
          text-anchor="middle">
      Text Chunking
    </text>

  </g>


  <!-- ====================================================== -->
  <!-- LOCAL EMBEDDINGS -->
  <!-- ====================================================== -->

  <g transform="translate(460,860)">

    <rect width="180"
          height="60"
          rx="12"
          fill="#ffffff"
          filter="url(#light-shadow)"/>

    <rect width="6"
          height="60"
          rx="3"
          fill="#3b82f6"/>

    <text x="93"
          y="27"
          font-size="14"
          font-weight="800"
          fill="#1e293b"
          text-anchor="middle">
      Local Embeddings
    </text>

    <text x="93"
          y="47"
          font-size="13"
          font-weight="500"
          fill="#64748b"
          text-anchor="middle">
      all-MiniLM-L6-v2
    </text>

  </g>


  <!-- ====================================================== -->
  <!-- OFFLINE CHROMA -->
  <!-- ====================================================== -->

  <g transform="translate(690,860)">

    <rect width="180"
          height="60"
          rx="12"
          fill="#ffffff"
          filter="url(#light-shadow)"/>

    <rect width="6"
          height="60"
          rx="3"
          fill="#10b981"/>

    <text x="93"
          y="27"
          font-size="14"
          font-weight="800"
          fill="#1e293b"
          text-anchor="middle">
      Chroma
    </text>

    <text x="93"
          y="47"
          font-size="13"
          font-weight="500"
          fill="#64748b"
          text-anchor="middle">
      Persistent Vector Store
    </text>

  </g>

</svg>